[build-system]
# hatchling 1.30+ (except 1.31) emits Metadata-Version 2.5, which twine 6.2 rejects (and the PyPI publish action runs
# twine): stay on 2.4 until the toolchain accepts 2.5. 1.27 is the first release with license-files (PEP 639).
requires = ["hatchling>=1.27,<1.30"]
build-backend = "hatchling.build"

[project]
name = "robotframework-harness"
dynamic = ["version"]
description = "Agent harness for Robot Framework: an Agent Skill, agent hooks and a local robotcode-based live session for Claude Code, Codex, GitHub Copilot, VS Code and OpenCode."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Many Kasiriha" }]
keywords = ["robotframework", "testing", "ai", "agents", "claude-code", "codex", "copilot", "opencode", "robotcode", "playwright"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Tool",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
# The installer has no dependencies, so `uvx robotframework-harness install` starts fast anywhere.
dependencies = []

[project.optional-dependencies]
# Installed by the installer into the project's Python environment (where Robot Framework and its libraries live).
runtime = [
    "robotframework>=7.0",
    "robotcode[repl,runner,analyze]>=2.7,<2.8",
]
quality = ["robotframework-robocop>=9.1"]

[project.urls]
Homepage = "https://github.com/manykarim/robotframework-harness"
Documentation = "https://github.com/manykarim/robotframework-harness/tree/main/docs"
Issues = "https://github.com/manykarim/robotframework-harness/issues"

[project.scripts]
robotframework-harness = "rf_harness.installer.cli:main"
rf-harness = "rf_harness.installer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "robotframework>=7.0",
    "robotcode[repl,runner,analyze]>=2.7,<2.8",
    "robotframework-robocop>=9.1",
]
# Simulation suite (tests/simulation, pytest marker `browser`): Browser library + RequestsLibrary (scenario C).
# After `uv sync --group dev --group browser`, run `uv run rfbrowser init --skip-browsers` once; chromium comes from
# ~/.cache/ms-playwright (the runtime sets PLAYWRIGHT_BROWSERS_PATH when the bundled one is missing).
browser = [
    "robotframework-browser==19.12.7",
    "robotframework-requests>=0.9.7",
]
# Documentation site (mkdocs.yml). mkdocs 2.0 drops the plugin/theme system Material needs: stay on 1.x.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[tool.uv]
# local-path installs (installer --runtime-source, tests) must rebuild when the version or the shipped files change;
# by default uv only re-keys its build cache on pyproject.toml
cache-keys = [{ file = "pyproject.toml" }, { file = "src/rf_harness/**/*.py" }, { file = "plugins/rf-harness/**" }]

[tool.hatch.version]
path = "src/rf_harness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_harness"]
artifacts = ["src/rf_harness/_assets/**"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["src/rf_harness", "plugins", "hatch_build.py", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["src/rf_harness/_assets", "eval", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Ported from the measured v3.2 prototype (hookpkg32, tasks 2.1/2.2) and kept close to that source for parity review:
# typing.List/Optional annotations, %-formatting and short loop names (`l`) stay as they were.
"src/rf_harness/runtime/{analyzer,docs,docsgen,engine,execd,guards,hook,hookcore,kwdoc,kwdocs,leanfmt,lintd,livetmo,pagestate,portable,procs,profiles,proto,pwlog,replfmt,rfh_repl_listener,richfmt,rthooks}.py" = ["UP006", "UP031", "UP035", "UP037", "UP045", "E741"]
"tests/simulation/{simlib,verify_hooks}.py" = ["UP006", "UP035", "UP037", "UP045", "E741"]
# Vendored verbatim from rf-mcp 0.36.0 (tests/runtime/test_hints.py pins its output to rf-mcp's engine).
"src/rf_harness/runtime/hints.py" = ["UP006", "UP035", "UP045", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src/rf_harness/installer", "src/rf_harness/config.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: needs Browser library + chromium (simulation suite)",
    "slow: takes more than a few seconds",
]
