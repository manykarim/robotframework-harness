name: release
# A version tag releases robotframework-harness (design: openspec/changes/release-v1-publishing/design.md):
#   v1.2.3      final release   -> verify, test, build -> PyPI (environment `pypi`, required reviewer) -> GitHub release
#                                  with wheel + sdist -> move the `stable` tag
#   v1.2.3rc4   release candidate -> verify, test, build -> TestPyPI only (environment `testpypi`); nothing else
# Publishing uses PyPI trusted publishing (OIDC): no API token exists in secrets or here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      final: ${{ steps.v.outputs.final }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: tag matches every version declaration; release notes exist for final releases
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/check_versions.py --tag "$TAG"
          version="${TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" =~ rc[0-9]+$ ]]; then
            echo "final=false" >> "$GITHUB_OUTPUT"
          else
            echo "final=true" >> "$GITHUB_OUTPUT"
            test -f "docs/releases/$version.md" || { echo "::error::docs/releases/$version.md is missing"; exit 1; }
          fi

  test:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run pytest -m "not browser" -q
      - name: generated reference is current
        run: uv run python scripts/gen_reference.py --check
      - name: evidence (checksums, scrub, claims)
        run: |
          python3 evidence/checksums.py --verify
          python3 evidence/scrub.py --check evidence --exclude _release_assets
          python3 evidence/check_claims.py --check-sources

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: wheel bundles the plugin (skill, launcher, hooks)
        run: |
          wheel=$(ls dist/*.whl)
          for f in rf_harness/_assets/skills/rf-harness/SKILL.md rf_harness/_assets/bin/rfh-launch \
                   rf_harness/_assets/hooks/hooks.json rf_harness/_assets/.claude-plugin/plugin.json; do
            unzip -l "$wheel" | grep -q " $f$" || { echo "::error::$f missing from $wheel"; exit 1; }
          done
      - name: package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    needs: [verify, build]
    if: needs.verify.outputs.final == 'false'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/robotframework-harness/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    needs: [verify, build]
    if: needs.verify.outputs.final == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/robotframework-harness/${{ needs.verify.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [verify, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: create the GitHub release with wheel and sdist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: gh release create "$TAG" dist/* --title "robotframework-harness $VERSION" --notes-file "docs/releases/$VERSION.md" --verify-tag

  move-stable:
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: point `stable` at the released commit (version tags are never moved)
        run: |
          git tag -f stable "$GITHUB_SHA"
          git push -f origin refs/tags/stable
