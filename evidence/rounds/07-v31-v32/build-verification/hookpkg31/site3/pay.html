<!doctype html><html><head><meta charset="utf-8"><title>Pay</title></head><body>
<label for="card">Card number</label> <input id="card" name="card">
<button id="confirm-card" onclick="ok()">Confirm card</button><span id="card-status"></span>
<script>function ok(){const v=document.getElementById('card').value;if(v.length>=4){document.getElementById('card-status').textContent='Card OK';parent.postMessage('card-ok','*');}
else{document.getElementById('card-status').textContent='Invalid card';}}</script></body></html>
