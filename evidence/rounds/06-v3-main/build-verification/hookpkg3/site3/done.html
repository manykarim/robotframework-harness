<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Shop - Confirmation</title></head><body>
<h1>Thank you</h1><p id="result" role="status">Processing...</p><div id="spinner">...</div>
<script>const q=new URLSearchParams(location.search);
setTimeout(()=>{document.getElementById('spinner').remove();document.getElementById('result').textContent='Done';
 const p=document.createElement('p');p.id='confirmation';p.setAttribute('data-test','confirmation');
 p.textContent='Order ORD-'+(1000+Number(q.get('total')||0))+' confirmed! Total: '+Number(q.get('total')||0).toFixed(2)+' EUR';
 document.body.appendChild(p);},4000);</script>
</body></html>
